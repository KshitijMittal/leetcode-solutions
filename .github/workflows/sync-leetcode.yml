name: Sync LeetCode Solutions

on:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours so solves sync the same day
  workflow_dispatch: # Allows you to trigger it manually from the Actions tab

permissions:
  contents: write # Allows the bot to push commits to the repo

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Sync Script
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_USERNAME: ${{ secrets.LEETCODE_USERNAME }}
        run: python sync_leetcode.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "KshitijMittal"
          git config --global user.email "193310873+KshitijMittal@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-sync LeetCode solutions"
            git push
          fi
